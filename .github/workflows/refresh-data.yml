name: Refresh latest NHL data

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      season_label:
        description: "Optional season label, e.g. 20252026"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-latest-nhl-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check Eastern hour
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SHOULD_RUN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$(TZ=America/New_York date +%H)" = "09" ]; then
            echo "SHOULD_RUN=true" >> "$GITHUB_ENV"
          else
            echo "SHOULD_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Check out repository
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: env.SHOULD_RUN == 'true'
        run: python -m pip install -r requirements.txt

      - name: Refresh data
        if: env.SHOULD_RUN == 'true'
        run: |
          SEASON_LABEL="${{ github.event.inputs.season_label }}"
          if [ -n "$SEASON_LABEL" ]; then
            python scripts/refresh_latest_data.py --season_label "$SEASON_LABEL"
          else
            python scripts/refresh_latest_data.py
          fi

      - name: Verify app artifacts
        if: env.SHOULD_RUN == 'true'
        run: |
          python scripts/health_check.py
          python -m pytest

      - name: Commit refreshed artifacts
        if: env.SHOULD_RUN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/app reports models

          if git diff --cached --quiet; then
            echo "No app data changes to commit."
            exit 0
          fi

          git commit -m "Auto-refresh latest NHL data"
          git push
